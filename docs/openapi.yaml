openapi: 3.0.3
info:
  title: 匹克球教学管理平台 API
  version: 1.0.0
  description: >
    学员档案、教学计划生成数据、教学追踪与量化考核的后端接口。
    数据存 SQLite；除健康检查与登录外均需 Bearer JWT。
    涉及伤病、青少年与常青负荷时系统仅输出评估提示，不做医疗诊断。
    P7 排课主线：课程包（买 N 节）→ 课程大纲（N 节 A/B/R）→ 执行一节课 → 课后点评。
    执行与点评均为单事务；/today 与 /state 已包含课程包与大纲，离线可见。
servers:
  - url: http://127.0.0.1:8787/api/v1
    description: 本机默认
  - url: /api/v1
    description: 同源部署

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Ok:
      type: object
      required: [success, data, timestamp]
      properties:
        success: { type: boolean, example: true }
        data: {}
        message: { type: string }
        timestamp: { type: string, format: date-time }
    Error:
      type: object
      required: [success, error, timestamp]
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
        timestamp: { type: string, format: date-time }
    Student:
      type: object
      required: [name]
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        age: { type: string, enum: [adult, youth, senior, mixed] }
        stage: { type: integer, minimum: 1, maximum: 3 }
        sizeLabel: { type: string }
        total: { type: integer }
        used: { type: integer }
        expire: { type: string }
        injury: { type: string, description: 非空即触发安全评估提示 }
        techScore: { type: number }
        fitScore: { type: number }
        goal: { type: string }
        status: { type: string, example: 在训 }
        note: { type: string }
    Plan:
      type: object
      required: [lesson]
      properties:
        id: { type: string }
        lesson: { type: integer, minimum: 1, maximum: 48 }
        stage: { type: integer, minimum: 1, maximum: 3 }
        tech: { type: string }
        minutes: { type: integer }
        date: { type: string, format: date }
        age: { type: string }
        ageName: { type: string }
        size: { type: string }
        zones: { type: array, items: { type: string } }
        focus: { type: string }
        text: { type: string, description: 教案全文 }
        studentIds:
          type: array
          items: { type: string }
          description: 多人班可含多个学员 ID
    Session:
      type: object
      properties:
        id: { type: string }
        studentId: { type: string }
        studentName: { type: string, readOnly: true }
        date: { type: string, format: date }
        lesson: { type: integer, minimum: 1, maximum: 48 }
        minutes: { type: integer }
        attend: { type: string, enum: [出勤, 请假, 缺勤] }
        judge: { type: string, enum: [达标, 部分达标, 未达标] }
        rpe: { type: integer, minimum: 1, maximum: 10 }
        note: { type: string }
    Assessment:
      type: object
      properties:
        id: { type: string }
        studentId: { type: string }
        studentName: { type: string, readOnly: true }
        stage: { type: integer, minimum: 1, maximum: 3 }
        date: { type: string, format: date }
        vals: { type: object, additionalProperties: { type: number } }
        total: { type: number, nullable: true }
        conclusion: { type: string }
    State:
      type: object
      properties:
        students: { type: array, items: { $ref: '#/components/schemas/Student' } }
        plans: { type: array, items: { $ref: '#/components/schemas/Plan' } }
        sessions: { type: array, items: { $ref: '#/components/schemas/Session' } }
        assessments: { type: array, items: { $ref: '#/components/schemas/Assessment' } }
        demo: { type: boolean }
        thresholds: { type: object }
        defaults: { type: object }
        prefs: { type: object }
        ui: { type: object }
        revision: { type: integer, description: 乐观锁版本号 }
    PagedList:
      type: object
      properties:
        items: { type: array, items: {} }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

paths:
  /health:
    get:
      summary: 健康检查
      security: []
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
  /auth/login:
    post:
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200': { description: token 与账号信息, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { description: 凭证错误, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/me:
    get:
      summary: 当前账号
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
  /auth/change-password:
    post:
      summary: 修改密码（新密码至少 10 位）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string }
                new_password: { type: string }
      responses:
        '200': { description: 已修改 }
        '401': { description: 原密码不正确 }
        '422': { description: 新密码长度不足 }
  /state:
    get:
      summary: 拉取全量 state 与 revision
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
    put:
      summary: 全量同步（单事务 + 乐观锁）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { $ref: '#/components/schemas/State' }
                revision: { type: integer, nullable: true }
      responses:
        '200': { description: 返回新 revision }
        '409': { description: revision 冲突，请刷新 }
        '422': { description: 校验失败 }
  /export:
    get:
      summary: 导出数据库备份
      responses:
        '200': { description: 含 format/version/exported_at/state }
  /import:
    post:
      summary: 导入备份（强制覆盖并重置版本号）
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: 导入成功 }
  /stats:
    get:
      summary: KPI 数值与逐项公式
      responses:
        '200': { description: values + definitions + caveats }
  /curriculum:
    get:
      summary: 24 教学单元 / 48 课次
      responses:
        '200': { description: units + lesson_count }
  /students/{id}/records:
    get:
      summary: 学员学习记录（进度、时间线、安全标记）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
        '404': { description: 学员不存在 }
  /students:
    get:
      summary: 学员列表（分页 / 搜索）
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, default: 50, maximum: 200 } }
        - { in: query, name: keyword, schema: { type: string } }
      responses:
        '200': { description: PagedList, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
    post:
      summary: 新增学员
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Student' }
      responses:
        '201': { description: 已创建 }
        '422': { description: 校验失败 }
  /students/{id}:
    get:
      summary: 学员详情
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: ok }
        '404': { description: 不存在 }
    patch:
      summary: 局部更新
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Student' }
      responses:
        '200': { description: ok }
    delete:
      summary: 软删除
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '204': { description: 已删除 }
  /plans:
    get: { summary: 教案列表, responses: { '200': { description: PagedList } } }
    post:
      summary: 新建教案
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Plan' }
      responses: { '201': { description: 已创建 }, '422': { description: 校验失败 } }
  /plans/{id}:
    get: { summary: 教案详情, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    patch: { summary: 更新教案, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    delete: { summary: 删除教案, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '204': { description: 已删除 } } }
  /sessions:
    get: { summary: 授课记录列表, responses: { '200': { description: PagedList } } }
    post:
      summary: 新增授课记录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Session' }
      responses: { '201': { description: 已创建 } }
  /sessions/{id}:
    get: { summary: 记录详情, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    patch: { summary: 更新记录, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    delete: { summary: 删除记录, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '204': { description: 已删除 } } }
  /assessments:
    get: { summary: 考核记录列表, responses: { '200': { description: PagedList } } }
    post:
      summary: 新增考核记录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Assessment' }
      responses: { '201': { description: 已创建 } }
  /assessments/{id}:
    get: { summary: 考核详情, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    patch: { summary: 更新考核, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    delete: { summary: 删除考核, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '204': { description: 已删除 } } }
  /fitness-battery:
    get:
      summary: 身体素质测评表（9 项测试卡 + 5 档锚点 + 年龄组/性别系数）
      description: 分档为参考分档（推定值），不是官方常模，也不是医疗诊断。
      responses: { '200': { description: ok } }
  /fitness-assessments:
    post:
      summary: 为学员开一份体能测评（固化测评表快照）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId]
              properties:
                studentId: { type: string }
                sex: { type: string, enum: [male, female] }
                ageGroupCode: { type: string, example: a18 }
                heightCm: { type: number }
                weightKg: { type: number }
                testDate: { type: string, format: date }
      responses: { '201': { description: 已创建 }, '404': { description: 学员不存在 }, '422': { description: 校验失败 } }
  /fitness-assessments/{id}:
    get:
      summary: 体能测评报告（9 维指数 / 强项补强 / 计划适配建议）
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses: { '200': { description: ok } }
  /fitness-assessments/{id}/results:
    put:
      summary: 录入单项实测值（非 measured 状态不计分）
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [itemCode]
                    properties:
                      itemCode: { type: string, example: plank }
                      rawValue: { type: number }
                      variantCode: { type: string, nullable: true }
                      status: { type: string, enum: [measured, aborted, skipped, contraindicated] }
                      note: { type: string }
      responses:
        '200': { description: ok }
        '409': { description: 已完成锁定（ASSESSMENT_LOCKED） }
        '422': { description: 值非法（INVALID_VALUE）或项目不存在（UNKNOWN_ITEM） }
  /fitness-assessments/{id}/finalize:
    post:
      summary: 生成报告并锁定（需 ≥6 项且覆盖 ≥4 个维度）
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '200': { description: ok }
        '422': { description: 项目不足（INCOMPLETE_BATTERY） }
  /fitness-assessments/{id}/apply-to-student:
    post:
      summary: 教练确认后把换算体能分写入学员档案（可选覆盖 0-5）
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '200': { description: ok }
        '409': { description: 未完成（NOT_COMPLETED）或无法换算（NO_SCORE） }
  /students/{id}/fitness-assessments:
    get:
      summary: 学员体能测评历史与趋势
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses: { '200': { description: ok } }
  /students/{id}/fitness-latest:
    get:
      summary: 最新一份已完成体能报告（教案 ④ 段适配数据源）
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses: { '200': { description: ok } }
  /curriculum-difficulty:
    get:
      summary: 24 单元难度 / 并列新授点 / 建议课次 / 放行判据 + 剂量模型 + 已知缺口
      responses: { '200': { description: ok } }
  /enrollments:
    get:
      summary: 课程包列表（含逐节大纲）
      parameters:
        - { in: query, name: studentId, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [active, completed, paused, cancelled] } }
      responses: { '200': { description: ok } }
    post:
      summary: 登记课程包并按难度与剂量生成 N 节大纲（单事务）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, totalLessons]
              properties:
                studentId: { type: string }
                totalLessons: { type: integer, minimum: 1, maximum: 200 }
                packageType: { type: string, enum: [solo, small, large] }
                lessonsPerWeek: { type: integer, minimum: 1, maximum: 7 }
                minutesPerLesson: { type: integer, minimum: 30, maximum: 180 }
                startDate: { type: string, format: date }
                startStage: { type: integer, minimum: 1, maximum: 3 }
                startUnit: { type: integer, minimum: 1, maximum: 24 }
                techLevel: { type: number, minimum: 0, maximum: 5 }
                fitLevel: { type: number, minimum: 0, maximum: 5 }
                ageGroup: { type: string, enum: [adult, youth, senior, mixed] }
                paceMode: { type: string, enum: [fixed, adaptive], description: adaptive 未达标插入同单元补强课，fixed 严格按购买课数排满 }
      responses:
        '201': { description: 建包并返回大纲 + generated（byUnit / truncated / truncatedReason） }
        '404': { description: 学员不存在（STUDENT_NOT_FOUND） }
        '422': { description: 课数或字段非法（VALIDATION_ERROR） }
  /enrollments/{id}:
    get:
      summary: 课程包详情（学员快照 + 逐节状态 + 进度）
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '200': { description: ok }
        '404': { description: 课程包不存在（ENROLLMENT_NOT_FOUND） }
    patch:
      summary: 改状态 / 节奏模式 / 频次 / 时长 / 备注
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '200': { description: ok }
        '422': { description: 取值非法（VALIDATION_ERROR） }
  /enrollments/{id}/lessons:
    post:
      summary: 执行一节课（幂等；单事务写授课记录 + 大纲状态 + 包已用 + 学员已耗）
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                outlineLessonId: { type: string, description: 不传则取第一个待上课次 }
                planId: { type: string }
                date: { type: string, format: date }
                judge: { type: string, enum: [达标, 部分达标, 未达标] }
                rpe: { type: integer, minimum: 1, maximum: 10 }
                attend: { type: string }
      responses:
        '201': { description: 返回 session + outlineLesson + duplicated + nextStep }
        '404': { description: 课程包或大纲课次不存在（ENROLLMENT_NOT_FOUND / OUTLINE_NOT_FOUND） }
        '409': { description: 没有待上课次（NO_PLANNED_LESSON）或课程包已取消（ENROLLMENT_CANCELLED） }
  /sessions/{id}/review:
    post:
      summary: 课后点评（3 要点达成 + 一句话 + 作业 + 下节重点），未达标自动把下一节改为同单元补强课
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [judge]
              properties:
                judge: { type: string, enum: [达标, 部分达标, 未达标] }
                attend: { type: string }
                rpe: { type: integer, minimum: 1, maximum: 10 }
                note: { type: string }
                homework: { type: string }
                nextFocus: { type: string }
                judgeVals: { type: object, description: '{ kp1: true, kp2: false, kp3: true }' }
      responses:
        '200': { description: 返回 session（reviewStatus=done）+ adjust（insert_r / hold / keep / none） }
        '404': { description: 授课记录不存在（SESSION_NOT_FOUND） }
        '422': { description: 判据取值非法（VALIDATION_ERROR） }
  /today:
    get:
      summary: 今日视图：当天待上课次 / 待点评 / 已过期未上
      parameters: [{ in: query, name: date, schema: { type: string, format: date } }]
      responses: { '200': { description: ok } }
