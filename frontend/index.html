<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>匹克球教学管理平台 V3.0 · 配置驱动教学与测评工作台</title>
<script src="/api.js?v=3.0.4"></script>
<script src="/v3-defaults.js?v=3.0.4"></script>
<script src="/report-pdf.js?v=3.0.4"></script>
<style>
:root{
  --ground:#0B0C0D; --surface-1:#141518; --surface-2:#1B1D21; --surface-3:#24272C;
  --hairline:rgba(255,255,255,.08); --hairline-2:rgba(255,255,255,.15);
  --text:#F2F3F1; --text-2:#A6ACB2; --text-3:#6F767E;
  --accent:#D8F35A; --accent-ink:#11130A;
  --ok:#74C99A; --warn:#EBB864; --danger:#EB786B; --info:#7CB8F2;
  --rs:6px; --rm:12px; --rl:16px;
  --pad:24px;
}
body[data-theme="light"]{
  --ground:#F5F5F0; --surface-1:#FFFFFF; --surface-2:#F8F8F4; --surface-3:#ECECE5;
  --hairline:rgba(15,18,20,.09); --hairline-2:rgba(15,18,20,.16);
  --text:#14161A; --text-2:#565E66; --text-3:#8A929A;
  --info:#2563EB;
}
body[data-accent="indigo"]{ --accent:#8B93F8; --accent-ink:#090A14; }
body[data-accent="coral"]{ --accent:#F28E72; --accent-ink:#1B0D08; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--text);
  font-family:'Space Grotesk','PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.muted{color:var(--text-3)}
.sec{color:var(--text-2)}
.app{display:grid;grid-template-columns:242px minmax(0,1fr);min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  border-right:1px solid var(--hairline);background:var(--surface-1);z-index:10;
}
.brand{padding:22px 20px 18px;border-bottom:1px solid var(--hairline)}
.brand-row{display:flex;align-items:center;gap:10px}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.02em}
.brand-sub{font-size:10px;letter-spacing:.1em;color:var(--text-3);margin-top:5px;text-transform:uppercase}
.nav{padding:14px 10px;display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
.nav-label{font-size:10px;letter-spacing:.12em;color:var(--text-3);text-transform:uppercase;padding:10px 10px 5px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--rs);
  color:var(--text-2);font-size:13px;border:1px solid transparent;background:none;width:100%;text-align:left;
  transition:background .15s,color .15s,border-color .15s;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item[aria-current="page"]{background:var(--surface-3);color:var(--text);border-color:var(--hairline-2)}
.nav-item[aria-current="page"] .nav-dot{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.nav-dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex:none}
.sidebar-foot{padding:14px 18px;border-top:1px solid var(--hairline);font-size:11px;color:var(--text-3);display:flex;flex-direction:column;gap:6px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;min-height:60px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:8px var(--pad);border-bottom:1px solid var(--hairline);
  background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(12px);
}
.topbar h1{font-size:16px;font-weight:600;margin:0}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.view{padding:var(--pad) var(--pad) 80px;max-width:1520px;width:100%}
.view[hidden]{display:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;
  border-radius:var(--rs);border:1px solid var(--hairline-2);background:var(--surface-2);
  color:var(--text);font-size:12.5px;font-weight:500;white-space:nowrap;transition:background .15s,filter .15s;
}
.btn:hover:not(:disabled){background:var(--surface-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn-primary:hover:not(:disabled){filter:brightness(1.06)}
.btn-ghost{background:transparent;border-color:var(--hairline)}
.btn-danger{border-color:color-mix(in srgb,var(--danger) 40%,transparent);color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,transparent)}
.btn-sm{padding:4px 9px;font-size:11.5px}
.chip{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;
  border:1px solid var(--hairline-2);font-size:11px;color:var(--text-2);white-space:nowrap;
}
.chip-accent{border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.chip-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.chip-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.chip-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:color-mix(in srgb,var(--danger) 8%,transparent)}
.chip-info{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent);background:color-mix(in srgb,var(--info) 8%,transparent)}
@media print{
  .sidebar,.topbar,.tabs,.btn,.modal-backdrop,.toast{display:none!important}
  .app{display:block}
  .view{padding:0!important;max-width:none!important}
  body{background:#fff!important;color:#111!important}
  .panel{break-inside:avoid;border-color:#ccc!important;background:#fff!important}
}
.panel{border:1px solid var(--hairline);border-radius:var(--rm);background:var(--surface-1);overflow:hidden;margin-bottom:16px}
.panel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--hairline)}
.panel-head h2,.panel-head h3{font-size:14px;font-weight:600;margin:0}
.panel-head .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-body{padding:16px 18px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px;border:1px solid var(--hairline);border-radius:var(--rm);background:var(--surface-1)}
.kpi .label{font-size:11px;color:var(--text-3);margin-bottom:6px}
.kpi .val{font-size:24px;font-weight:700;letter-spacing:-.02em}
.kpi .sub{font-size:11px;color:var(--text-2);margin-top:4px}
.split-2{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.split-plan{display:grid;grid-template-columns:390px minmax(0,1fr);gap:16px;align-items:start}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:11.5px;color:var(--text-2);font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;padding:8px 10px;border-radius:var(--rs);border:1px solid var(--hairline-2);
  background:var(--surface-2);color:var(--text);font-size:13px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:66px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:500;font-size:11px;color:var(--text-3);padding:10px 12px;border-bottom:1px solid var(--hairline);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--hairline);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
.list-card{
  padding:12px 14px;border:1px solid var(--hairline);border-radius:var(--rs);background:var(--surface-1);
  margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s;
}
.list-card:hover{background:var(--surface-2)}
.list-card.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface-1))}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--hairline);padding:0 18px;background:var(--surface-1)}
.tab-btn{
  padding:11px 14px;border:none;border-bottom:2px solid transparent;background:none;
  color:var(--text-2);font-size:13px;font-weight:500;
}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.score-pills{display:inline-flex;gap:4px;flex-wrap:wrap}
.score-pill{
  min-width:28px;height:26px;padding:0 7px;border-radius:5px;border:1px solid var(--hairline-2);
  background:var(--surface-2);font-size:11.5px;display:inline-flex;align-items:center;justify-content:center;
}
.score-pill.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.bar-bg{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .25s ease}
.notice{padding:10px 13px;border-radius:var(--rs);border:1px solid var(--hairline-2);background:var(--surface-2);font-size:12px;color:var(--text-2);line-height:1.55;margin-bottom:12px}
.notice-accent{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.notice-warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--warn)}
.notice-danger{border-color:color-mix(in srgb,var(--danger) 45%,transparent);color:var(--danger)}
.modal-backdrop{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:18px;
}
.modal-backdrop[hidden]{display:none}
.modal-box{
  width:min(860px,96vw);max-height:90vh;display:flex;flex-direction:column;
  background:var(--surface-1);border:1px solid var(--hairline-2);border-radius:var(--rm);overflow:hidden;
}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:10px}
.modal-head h3{margin:0;font-size:15px}
.modal-body{padding:18px;overflow:auto;flex:1}
.modal-foot{padding:12px 18px;border-top:1px solid var(--hairline);display:flex;justify-content:flex-end;gap:8px;background:var(--surface-2)}
.toast{
  position:fixed;right:20px;bottom:20px;z-index:90;padding:10px 16px;border-radius:8px;
  background:var(--surface-3);border:1px solid var(--accent);color:var(--text);font-size:12.5px;
  box-shadow:0 12px 30px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);pointer-events:none;transition:all .2s;
}
.toast.show{opacity:1;transform:translateY(0)}
.radar-wrap{display:flex;justify-content:center;align-items:center;padding:8px}
@media(max-width:1024px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--hairline)}
  .nav{flex-direction:row;flex-wrap:wrap}
  .kpi-grid,.split-2,.split-plan,.grid-2,.grid-3{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-row">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9.5" stroke="var(--accent)" stroke-width="2"/><circle cx="9.5" cy="9.5" r="1.4" fill="var(--accent)"/><circle cx="14.5" cy="9.5" r="1.4" fill="var(--accent)"/><circle cx="12" cy="14" r="1.4" fill="var(--accent)"/></svg>
        <div class="brand-name">匹克球教学平台</div>
      </div>
      <div class="brand-sub">V3.0 · 配置驱动教学与测评系统</div>
    </div>
    <nav class="nav" id="mainNav">
      <div class="nav-label">日常执教</div>
      <button class="nav-item" data-view="today" aria-current="page"><span class="nav-dot"></span>今日工作台</button>
      <button class="nav-item" data-view="students"><span class="nav-dot"></span>学员档案与成长报告</button>
      <button class="nav-item" data-view="plans"><span class="nav-dot"></span>教学计划与 60' 教案</button>
      <div class="nav-label">标准与配置</div>
      <button class="nav-item" data-view="curriculum"><span class="nav-dot"></span>大纲与算分配置</button>
      <button class="nav-item" data-view="fitness_guide"><span class="nav-dot"></span>6 维体能与常模参考</button>
      <button class="nav-item" data-view="settings"><span class="nav-dot"></span>系统设置与备份</button>
    </nav>
    <div class="sidebar-foot">
      <div id="authFoot"><span style="color:var(--warn)">●</span> 检查登录状态…</div>
      <div class="mono" id="cfgVerFoot">大纲 V2.2.0</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="topTitle">今日工作台</h1>
      <span class="chip chip-accent mono" id="cfgBadge">34 模块 · 60 分钟标准课时</span>
      <div class="topbar-right">
        <span class="chip" id="syncBadge">待同步</span>
        <button class="btn btn-sm" id="btnAuthAction" onclick="handleAuthBtn()">登录同步</button>
        <button class="btn btn-primary btn-sm" onclick="openNewStudentModal()">+ 学员建档</button>
        <button class="btn btn-sm" onclick="openNewPlanModal()">+ 新建计划</button>
      </div>
    </header>

    <!-- 1. 今日工作台 -->
    <section class="view" id="view-today"></section>
    <!-- 2. 学员档案与全维报告 -->
    <section class="view" id="view-students" hidden></section>
    <!-- 3. 教学计划与 60 分钟教案 -->
    <section class="view" id="view-plans" hidden></section>
    <!-- 4. 大纲热配置中心 -->
    <section class="view" id="view-curriculum" hidden></section>
    <!-- 5. 6 维球场体能参考 -->
    <section class="view" id="view-fitness_guide" hidden></section>
    <!-- 6. 设置与备份 -->
    <section class="view" id="view-settings" hidden></section>
  </div>
</div>

<!-- 通用模态框 -->
<div class="modal-backdrop" id="v3Modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="v3ModalTitle">操作</h3>
      <button class="btn btn-sm btn-ghost" style="margin-left:auto" onclick="closeModal()">关闭</button>
    </div>
    <div class="modal-body" id="v3ModalBody"></div>
    <div class="modal-foot" id="v3ModalFoot"></div>
  </div>
</div>

<div class="toast" id="v3Toast"></div>

<script>
(function(){
'use strict';

/* ==================== 核心状态与配置 ==================== */
const STORE_PREF_KEY = 'pkb.v3.prefs';
const V3 = {
  view: 'today',
  config: JSON.parse(JSON.stringify(window.PKB_DEFAULT_CURRICULUM || {})),
  battery: JSON.parse(JSON.stringify(window.PKB_DEFAULT_FITNESS || {})),
  students: [],
  activeStudentId: null,
  activeStudentReport: null,
  studentTab: 'report', // 'report' | 'fitness'
  compareSnapshotIds: { current: null, prev: null },
  plans: [],
  activePlanId: null,
  activeLessonId: null,
  activeLessonDetail: null,
  online: false,
  prefs: { theme: 'dark', accent: 'lime' }
};

try {
  const savedPrefs = JSON.parse(localStorage.getItem(STORE_PREF_KEY) || '{}');
  if (savedPrefs.theme) V3.prefs.theme = savedPrefs.theme;
  if (savedPrefs.accent) V3.prefs.accent = savedPrefs.accent;
} catch (_) {}

function applyPrefs() {
  document.body.dataset.theme = V3.prefs.theme || 'dark';
  document.body.dataset.accent = V3.prefs.accent || 'lime';
  try { localStorage.setItem(STORE_PREF_KEY, JSON.stringify(V3.prefs)); } catch (_) {}
}
applyPrefs();

/* ==================== 工具函数 ==================== */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const escJs = (s) => esc(JSON.stringify(String(s == null ? '' : s)));
const todayStr = () => new Date().toISOString().slice(0, 10);

async function withBusy(btn, fn) {
  if (btn && btn.disabled) return;
  if (btn) btn.disabled = true;
  try { return await fn(); } finally { if (btn) btn.disabled = false; }
}

function toast(msg) {
  const el = $('#v3Toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2600);
}
window.toast = toast;

async function api(path, opts) {
  if (!window.PKB_API) throw new Error('离线环境无法调用服务端接口');
  return window.PKB_API.request(path, Object.assign({ interactive: true }, opts || {}));
}

function getScoreScaleLabel(score) {
  const s = Number(score) || 0;
  const arr = (V3.config && (V3.config.scoringScale || V3.config.scoreScale)) || [
    { score: 0, label: '不会' }, { score: 1, label: '初步建立' },
    { score: 2, label: '基本掌握' }, { score: 3, label: '稳定应用' },
    { score: 4, label: '实战应用' }, { score: 5, label: '灵活运用' }
  ];
  const f = arr.find(x => Number(x.score != null ? x.score : x.value) === s);
  return f ? `${s}分·${f.label}` : `${s}分`;
}

function getAgeGroupName(id) {
  const g = ((V3.battery && V3.battery.ageGroups) || []).find(x => x.id === id);
  return g ? g.name : (id || '18–34 青年');
}

function getTriggerLabel(t) {
  return ({
    baseline: '建档基线快照',
    lesson_review: '课后点评自动快照',
    fitness_update: '体能测评更新快照',
    manual: '教练手动快照'
  })[t] || t;
}

/* ==================== 前后端同源纯算法：7大类0–10计算 & 6维体能换算 ==================== */
function computeCategoryScoresClient(scoreObj, cfgInput) {
  const cfg = cfgInput || V3.config || {};
  const scoreOf = (code) => {
    const n = Number(scoreObj && scoreObj[code]);
    return Number.isFinite(n) ? Math.max(0, Math.min(5, Math.round(n))) : 0;
  };
  const tracks = (cfg.tracks || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  const categories = (cfg.categories || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
  const modules = (cfg.modules || []).slice().sort((a, b) => (a.seq || 0) - (b.seq || 0));

  const out = categories.map(cat => {
    const catMods = modules.filter(m => m.categoryId === cat.id);
    const weights = cat.trackWeights || Object.fromEntries(tracks.map(t => [t.id, t.weightMax || 0]));
    const activeTracks = tracks.filter(t => catMods.some(m => m.track === t.id) && Number(weights[t.id] || 0) > 0);
    const rawWeightSum = activeTracks.reduce((a, t) => a + Number(weights[t.id] || 0), 0) || 1;
    const scaleTo10 = 10 / rawWeightSum;

    let catScore = 0;
    for (const tr of activeTracks) {
      const trMods = catMods.filter(m => m.track === tr.id);
      const w = Number(weights[tr.id] || 0) * scaleTo10;
      let earned = 0;
      if (tr.mode === 'elective') {
        const k = Math.max(1, Math.min(trMods.length, Number(cat.advTopK) || 2));
        const top = trMods.map(m => scoreOf(m.code)).sort((a, b) => b - a).slice(0, k);
        earned = (top.reduce((a, b) => a + b, 0) / (k * 5)) * w;
      } else {
        const sum = trMods.reduce((a, m) => a + scoreOf(m.code), 0);
        earned = (trMods.length ? (sum / (trMods.length * 5)) : 0) * w;
      }
      catScore += earned;
    }
    const basicMods = catMods.filter(m => m.track === 'basic');
    const advMods = catMods.filter(m => m.track !== 'basic');
    return {
      id: cat.id,
      name: cat.name,
      score: Math.round(catScore * 10) / 10,
      basicMastered: basicMods.filter(m => scoreOf(m.code) >= 2).length,
      basicTotal: basicMods.length,
      advLearned: advMods.filter(m => scoreOf(m.code) >= 1).length,
      advTotal: advMods.length
    };
  });
  const overallScore = out.length ? Math.round((out.reduce((a, c) => a + c.score, 0) / out.length) * 10) / 10 : 0;
  return { categories: out, overallScore };
}

function interpolateAnchorClient(val, anchors, direction) {
  const ys = [15, 38, 62, 82, 98];
  const v = Number(val);
  if (!Number.isFinite(v) || !Array.isArray(anchors) || anchors.length < 5) return null;
  if (direction === 'lower_better') {
    if (v >= anchors[0]) {
      const extra = Math.min(10, ((v - anchors[0]) / Math.max(1, anchors[0] * 0.35)) * 10);
      return Math.max(5, Math.round(ys[0] - extra));
    }
    if (v <= anchors[4]) return 100;
    for (let i = 0; i < 4; i++) {
      const a = anchors[i], b = anchors[i + 1];
      if (v <= a && v >= b) return Math.round(ys[i] + ((a - v) / Math.max(0.0001, a - b)) * (ys[i + 1] - ys[i]));
    }
    return ys[2];
  } else {
    if (v <= anchors[0]) {
      const drop = Math.min(10, ((anchors[0] - v) / Math.max(1, anchors[0])) * 10);
      return Math.max(5, Math.round(ys[0] - drop));
    }
    if (v >= anchors[4]) return 100;
    for (let i = 0; i < 4; i++) {
      const a = anchors[i], b = anchors[i + 1];
      if (v >= a && v <= b) return Math.round(ys[i] + ((v - a) / Math.max(0.0001, b - a)) * (ys[i + 1] - ys[i]));
    }
    return ys[2];
  }
}

function evaluateFitnessClient(rawInput, gender, ageGroup) {
  const bat = V3.battery || {};
  const g = gender === 'female' ? 'female' : 'male';
  const ag = ageGroup || 'a18';
  const dims = (bat.dimensions || []).map(dim => {
    const item = (rawInput && rawInput[dim.key]) || {};
    if (item.skipped) return { key: dim.key, name: dim.name, score: null, skipped: true, skipReason: item.skipReason || '安全跳过' };
    let eff = null;
    if (dim.key === 'flexibility') {
      const b = item.bendLevel != null && item.bendLevel !== '' ? Number(item.bendLevel) : null;
      const s = item.shoulderLevel != null && item.shoulderLevel !== '' ? Number(item.shoulderLevel) : null;
      const sNorm = s != null ? 1 + ((s - 1) * (4 / 3)) : null;
      if (b != null && sNorm != null) eff = (b + sNorm) / 2;
      else if (b != null) eff = b;
      else if (sNorm != null) eff = sNorm;
      else if (item.value != null && item.value !== '') eff = Number(item.value);
    } else if (item.value != null && item.value !== '') {
      const n = Number(item.value);
      eff = item.altUsed && item.autoScaleAlt && dim.altScale ? n * dim.altScale : n;
    }
    const anchors = (((bat.anchors || {})[dim.key] || {})[g] || {})[ag];
    const score = eff != null && anchors ? interpolateAnchorClient(eff, anchors, dim.direction) : null;
    return { key: dim.key, name: dim.name, score, skipped: false, effectiveValue: eff };
  });
  const valid = dims.filter(d => d.score != null && !d.skipped);
  const totalIndex = valid.length ? Math.round(valid.reduce((a, d) => a + d.score, 0) / valid.length) : null;
  return { dimensions: dims, totalIndex };
}

/* ==================== 专业 SVG 雷达图（6维体能六边形 + 7维技术能力图） ==================== */
function renderPolygonRadarSVG(axes, primaryVals, compareVals, opts) {
  const o = opts || {};
  const size = o.size || 290;
  const cx = size / 2, cy = size / 2, r = size * 0.34;
  const maxVal = o.maxVal || 100;
  const refVal = o.refVal || (maxVal === 100 ? 60 : 6);
  const n = axes.length;
  const pt = (idx, val) => {
    const ang = (-Math.PI / 2) + (idx * 2 * Math.PI / n);
    const ratio = Math.max(0.04, Math.min(1, (Number(val) || 0) / maxVal));
    return [cx + Math.cos(ang) * r * ratio, cy + Math.sin(ang) * r * ratio];
  };
  const poly = (vals) => vals.map((v, i) => pt(i, v).map(x => x.toFixed(1)).join(',')).join(' ');
  const gridLevels = [0.25, 0.5, 0.75, 1];
  const gridSVG = gridLevels.map(lv => {
    const pts = axes.map((_, i) => pt(i, maxVal * lv).map(x => x.toFixed(1)).join(',')).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,0.11)" stroke-width="1"/>`;
  }).join('');
  const axisSVG = axes.map((ax, i) => {
    const [x, y] = pt(i, maxVal);
    const [lx, ly] = [cx + Math.cos(-Math.PI/2 + i*2*Math.PI/n) * (r + 24), cy + Math.sin(-Math.PI/2 + i*2*Math.PI/n) * (r + 20)];
    const val = primaryVals[i];
    const disp = val == null ? '跳过' : (maxVal === 10 ? Number(val).toFixed(1) : Math.round(val));
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="${lx.toFixed(1)}" y="${(ly - 2).toFixed(1)}" text-anchor="middle" fill="var(--text)" font-size="11.5" font-weight="600">${esc(ax.label)}</text>
      <text x="${lx.toFixed(1)}" y="${(ly + 12).toFixed(1)}" text-anchor="middle" fill="${val == null ? 'var(--warn)' : 'var(--accent)'}" font-size="10.5" class="mono">${esc(disp)}</text>`;
  }).join('');
  const refPts = poly(axes.map(() => refVal));
  const cmpSVG = Array.isArray(compareVals) && compareVals.length === n
    ? `<polygon points="${poly(compareVals.map(v => v == null ? 0 : v))}" fill="rgba(124,184,242,0.10)" stroke="#7CB8F2" stroke-width="1.6" stroke-dasharray="4 3"/>`
    : '';
  const priPts = poly(primaryVals.map(v => v == null ? 0 : v));
  const dots = primaryVals.map((v, i) => {
    if (v == null) return '';
    const [x, y] = pt(i, v);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.8" fill="var(--accent)" stroke="#0B0C0D" stroke-width="1.4"/>`;
  }).join('');

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-label="${esc(o.ariaLabel || '能力雷达图')}">
    ${gridSVG}
    <polygon points="${refPts}" fill="none" stroke="rgba(235,184,100,0.45)" stroke-width="1.1" stroke-dasharray="3 3"/>
    ${axisSVG}
    ${cmpSVG}
    <polygon points="${priPts}" fill="rgba(216,243,90,0.20)" stroke="var(--accent)" stroke-width="2.2"/>
    ${dots}
  </svg>`;
}

function renderFitnessHexagonSVG(fitReport, prevFitReport) {
  const order = ['power', 'reaction', 'mobility', 'balance', 'flexibility', 'endurance'];
  const fallbackLabels = { power:'爆发力', reaction:'反应', mobility:'移动', balance:'平衡', flexibility:'柔韧', endurance:'耐力' };
  const dims = fitReport ? fitReport.dimensions || [] : [];
  const axes = order.map(k => {
    const f = dims.find(d => d.key === k);
    return { key: k, label: f ? f.name : fallbackLabels[k] };
  });
  const primary = order.map(k => {
    const f = dims.find(d => d.key === k);
    return f ? f.score : null;
  });
  const cmp = prevFitReport
    ? order.map(k => {
        const f = (prevFitReport.dimensions || []).find(d => d.key === k);
        return f ? f.score : null;
      })
    : null;
  return renderPolygonRadarSVG(axes, primary, cmp, { size: 300, maxVal: 100, refVal: 60, ariaLabel: '6维零道具体能六边形图' });
}

async function refreshAll() {
  updateAuthUI();
  if (!window.PKB_API) { renderActiveView(); return; }
  const st = window.PKB_API.status();
  if (!st.authenticated) { renderActiveView(); return; }
  try {
    const [cfg, bat, stuRes, planRes] = await Promise.all([
      api('/v3/curriculum/config', { interactive: false }),
      api('/v3/fitness/battery', { interactive: false }),
      api('/v3/students', { interactive: false }),
      api('/v3/plans', { interactive: false })
    ]);
    if (cfg && cfg.modules) V3.config = cfg;
    if (bat && bat.dimensions) V3.battery = bat;
    V3.students = (stuRes && stuRes.items) || [];
    V3.plans = (planRes && planRes.items) || [];
    if (!V3.activeStudentId && V3.students.length) V3.activeStudentId = V3.students[0].id;
    if (!V3.activePlanId && V3.plans.length) V3.activePlanId = V3.plans[0].id;
    V3.online = true;
    if (V3.activeStudentId) await loadStudentReport(V3.activeStudentId);
    if (V3.activePlanId && V3.activeLessonId) await loadLessonDetail(V3.activePlanId, V3.activeLessonId);
  } catch (e) {
    console.warn('refreshAll:', e.message);
  }
  updateAuthUI();
  renderActiveView();
}

async function loadStudentReport(studentId) {
  V3.activeStudentId = studentId;
  if (!window.PKB_API || !window.PKB_API.status().authenticated) return;
  try {
    V3.activeStudentReport = await api(`/v3/students/${encodeURIComponent(studentId)}`, { interactive: false });
    const snaps = (V3.activeStudentReport && V3.activeStudentReport.snapshots) || [];
    V3.compareSnapshotIds = {
      current: snaps[0] ? snaps[0].id : null,
      prev: snaps.length > 1 ? snaps[snaps.length - 1].id : (snaps[0] ? snaps[0].id : null)
    };
  } catch (_) { V3.activeStudentReport = null; }
}

async function loadLessonDetail(planId, lessonId) {
  V3.activePlanId = planId;
  V3.activeLessonId = lessonId;
  if (!window.PKB_API || !window.PKB_API.status().authenticated) return;
  try {
    V3.activeLessonDetail = await api(`/v3/plans/${encodeURIComponent(planId)}/lessons/${encodeURIComponent(lessonId)}`, { interactive: false });
  } catch (_) { V3.activeLessonDetail = null; }
}

window.handleAuthBtn = async function() {
  if (!window.PKB_API) return;
  const st = window.PKB_API.status();
  if (st.online) {

};

            ${s.racketBg ? ' · 球类基础：' + esc(s.racketBg) : ''}
            · 目标：${esc(s.target)}
            ${s.injury ? ' · <span style="color:var(--warn)">伤病提示：' + esc(s.injury) + '</span>' : ''}
          </div>
        </div>
        <div class="right">
          <button class="btn btn-sm" onclick="openNewPlanModal('${esc(s.id)}')">为 TA 排教学计划</button>
          <button class="btn btn-sm" onclick="captureManualSnapshot('${esc(s.id)}')">手动存快照</button>
          <button class="btn btn-sm btn-danger" onclick="deleteV3Student('${esc(s.id)}')">删除</button>
        </div>
      </div>
      <div class="tabs">
        <button class="tab-btn ${V3.studentTab === 'report' ? 'active' : ''}" onclick="setStudentTab('report')">综合能力报告与历史快照 (${snaps.length})</button>
        <button class="tab-btn ${V3.studentTab === 'fitness' ? 'active' : ''}" onclick="setStudentTab('fitness')">6 维零道具体能与六边形报告 (${(rpt.fitnessHistory || []).length})</button>
      </div>
    </div>
  `;

  if (V3.studentTab === 'fitness') {
    return headerHTML + renderStudentFitnessTab(rpt);
  }
  return headerHTML + renderStudentReportTab(rpt, curSnap, prevSnap, snaps);
}

window.setStudentTab = function(tab) {
  V3.studentTab = tab;
  renderStudents();
};

function renderStudentReportTab(rpt, curSnap, prevSnap, snaps) {
  const s = rpt.student;
  const live = rpt.liveAssessment || { categories: [], modules: [], overallScore: 0 };
  const cats = (curSnap && curSnap.categories) || live.categories || [];
  const prevCatMap = new Map(((prevSnap && prevSnap.categories) || []).map(c => [c.id, Number(c.score) || 0]));
  const curScore = curSnap ? curSnap.overallScore : live.overallScore;
  const prevScore = prevSnap ? prevSnap.overallScore : curScore;
  const totalDelta = Math.round((curScore - prevScore) * 10) / 10;

  const techRadar = renderPolygonRadarSVG(
    cats.map(c => ({ label: c.name.slice(0, 4) })),
    cats.map(c => c.score),
    prevSnap && curSnap && prevSnap.id !== curSnap.id ? cats.map(c => prevCatMap.get(c.id) || 0) : null,
    { size: 300, maxVal: 10, refVal: 6, ariaLabel: '7大技术类别能力雷达图' }
  );

  const snapSelectHTML = snaps.length ? `
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:6px">
        <span class="sec" style="font-size:12px">当前展示：</span>
        <select style="width:auto;min-width:210px" onchange="changeSnapCompare('current', this.value)">
          ${snaps.map((sn, i) => `<option value="${esc(sn.id)}" ${curSnap && sn.id === curSnap.id ? 'selected' : ''}>${i === 0 ? '[最新] ' : ''}${esc(sn.createdAt.slice(0, 16).replace('T', ' '))} · ${esc(getTriggerLabel(sn.triggerType))} (${sn.overallScore}分)</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="sec" style="font-size:12px">对比基准：</span>
        <select style="width:auto;min-width:210px" onchange="changeSnapCompare('prev', this.value)">
          ${snaps.map((sn, i) => `<option value="${esc(sn.id)}" ${prevSnap && sn.id === prevSnap.id ? 'selected' : ''}>${i === snaps.length - 1 ? '[建档基线] ' : ''}${esc(sn.createdAt.slice(0, 16).replace('T', ' '))} (${sn.overallScore}分)</option>`).join('')}
        </select>
      </div>
      <span class="chip chip-info mono">快照版本 V${esc((curSnap && curSnap.curriculumVersion) || V3.config.version)}</span>
    </div>
  ` : '';

  const catCards = cats.map(c => {
    const p = prevCatMap.has(c.id) ? prevCatMap.get(c.id) : c.score;
    const d = Math.round((c.score - p) * 10) / 10;
    const deltaChip = d > 0 ? `<span class="chip chip-ok mono">+${d}</span>` : (d < 0 ? `<span class="chip chip-danger mono">${d}</span>` : `<span class="chip mono">持平</span>`);
    return `
      <div style="padding:10px 12px;border:1px solid var(--hairline);border-radius:8px;background:var(--surface-2);margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <strong>${esc(c.name)}</strong>
          ${deltaChip}
          <span class="mono" style="margin-left:auto;font-weight:700;color:var(--accent)">${c.score.toFixed(1)} <span class="muted" style="font-weight:400">/ 10</span></span>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(100, c.score * 10)}%"></div></div>
        <div class="sec" style="font-size:11px;margin-top:5px">初阶掌握 ${c.basicMastered}/${c.basicTotal} · 进阶已涉猎 ${c.advLearned}/${c.advTotal}</div>
      </div>
    `;
  }).join('');

  const modRows = (live.modules || []).map(m => {
    const scoreBtns = [0, 1, 2, 3, 4, 5].map(v =>
      `<button type="button" class="score-pill ${m.score === v ? 'active' : ''}" onclick="quickSetModuleScore('${esc(s.id)}','${esc(m.code)}',${v})">${v}</button>`
    ).join('');
    return `
      <tr>
        <td class="mono"><strong>${esc(m.code)}</strong></td>
        <td><span class="chip ${m.track === 'basic' ? 'chip-accent' : 'chip-info'}">${m.track === 'basic' ? '初阶' : (m.track === 'advanced' ? '进阶' : esc(m.track))}</span></td>
        <td>${esc(m.title)}</td>
        <td>${m.practiceCount ? `<span class="chip chip-ok">已练 ${m.practiceCount} 次</span>` : `<span class="muted">${m.score > 0 ? '口头预填' : '未学(0分)'}</span>`}</td>
        <td><div class="score-pills">${scoreBtns}</div></td>
      </tr>
    `;
  }).join('');

  return `
    <div class="panel">
      <div class="panel-head">
        <h2>7 大技术类别 0–10 分报告</h2>
        <span class="chip chip-accent mono">综合均分 ${curScore.toFixed(1)} / 10</span>
        ${totalDelta !== 0 ? `<span class="chip ${totalDelta > 0 ? 'chip-ok' : 'chip-danger'} mono">较对比基线 ${totalDelta > 0 ? '+' : ''}${totalDelta}</span>` : ''}
        <div class="right" style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn btn-primary btn-sm" onclick="exportStudentTechReport('pdf')">导出技术报告 PDF</button>
          <button class="btn btn-sm" onclick="openReportExportModal('tech')">预览 / 转发网页版</button>
        </div>
      </div>
      <div class="panel-body">
        ${snapSelectHTML}
        ${curSnap && curSnap.summaryNote ? `<div class="notice"><strong>快照备注：</strong>${esc(curSnap.summaryNote)}</div>` : ''}
        <div class="grid-2" style="align-items:center">
          <div>${catCards}</div>
          <div class="radar-wrap" style="flex-direction:column">
            ${techRadar}
            <div class="muted" style="font-size:11px">实线：当前选中快照 · 虚橙线：6分参考线 · 虚蓝线：对比历史快照</div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>全大纲技术模块评分明细（0=不会 起步 · 0~5分）</h2>
        <div class="right"><button class="btn btn-sm btn-primary" onclick="captureManualSnapshot('${esc(s.id)}')">保存当前快照</button></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>编号</th><th>赛道</th><th>技术模块名称</th><th>课次状态</th><th>当前等级 (0不会 ~ 5灵活运用)</th></tr></thead>
          <tbody>${modRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

window.changeSnapCompare = function(which, snapId) {
  V3.compareSnapshotIds[which] = snapId;
  renderStudents();
};

window.quickSetModuleScore = async function(studentId, code, val) {
  try {
    await api(`/v3/students/${encodeURIComponent(studentId)}/scores`, {
      method: 'PUT',
      body: JSON.stringify({ scores: { [code]: val }, createSnapshot: false })
    });
    await loadStudentReport(studentId);
    const stuIdx = V3.students.findIndex(x => x.id === studentId);
    if (stuIdx >= 0 && V3.activeStudentReport) {
      V3.students[stuIdx].overallScore = V3.activeStudentReport.liveAssessment.overallScore;
    }
    toast(`已更新 ${code} 为 ${val} 分`);
    renderStudents();
  } catch (e) { toast('保存失败：' + e.message); }
};

window.captureManualSnapshot = async function(studentId) {
  try {
    await api(`/v3/students/${encodeURIComponent(studentId)}/snapshots`, {
      method: 'POST',
      body: JSON.stringify({ triggerType: 'manual', summaryNote: '教练阶段性留存技术快照' })
    });
    await loadStudentReport(studentId);
    toast('已冻结保存新的历史报告快照');
    renderStudents();
  } catch (e) { toast('操作失败：' + e.message); }
};

window.deleteV3Student = async function(studentId) {
  if (!confirm('确认删除该学员档案？删除后不可恢复。')) return;
  try {
    await api(`/v3/students/${encodeURIComponent(studentId)}`, { method: 'DELETE' });
    V3.activeStudentId = null;
    V3.activeStudentReport = null;
    await refreshAll();
    toast('学员已删除');
  } catch (e) { toast('删除失败：' + e.message); }
};

/* ---------- 6 维零道具体能 Tab ---------- */
function renderStudentFitnessTab(rpt) {
  const s = rpt.student;
  const bat = V3.battery || { dimensions: [], ageGroups: [] };
  const hist = rpt.fitnessHistory || [];
  const latest = hist[0] || rpt.latestFitness || null;
  const prev = hist.length > 1 ? hist[hist.length - 1] : null;
  const raw = (latest && latest.raw) || {};

  const hexSVG = latest
    ? renderFitnessHexagonSVG(latest, prev)
    : `<div class="sec" style="padding:40px 20px;text-align:center">暂未录制球场 6 维体能测评，填写右侧纯站姿客观数据后即可实时生成六边形雷达图。</div>`;

  const dimBadges = latest ? (latest.dimensions || []).map(d => `
    <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--hairline)">
      <strong style="min-width:54px">${esc(d.name)}</strong>
      <span class="sec" style="font-size:12px">${d.skipped ? '跳过：' + esc(d.skipReason) : (d.rawValue + ' ' + esc(d.unit))}</span>
      <span class="chip ${d.skipped ? 'chip-warn' : (d.score >= 60 ? 'chip-ok' : 'chip-danger')} mono" style="margin-left:auto">
        ${d.skipped ? '跳过' : d.score + '分 · ' + esc(d.levelText)}
      </span>
    </div>
  `).join('') : '';

  const hintsHTML = latest && ((latest.trainingHints || []).length || (latest.safetyNotes || []).length) ? `
    <div class="notice notice-accent" style="margin-top:10px">
      <strong>课堂 60 分钟联动与居家处方：</strong>
      ${(latest.trainingHints || []).map(h => `<div style="margin-top:4px">• <strong>${esc(h.dimName)}(${h.score}分)</strong>：${esc(h.classroomHint)}｜<em>居家：${esc(h.homeTip)}</em></div>`).join('')}
      ${(latest.safetyNotes || []).map(n => `<div style="margin-top:4px;color:var(--warn)">• ${esc(n)}</div>`).join('')}
    </div>
  ` : '';

  const formInputs = (bat.dimensions || []).map(dim => {
    const rec = raw[dim.key] || {};
    const skipChecked = rec.skipped ? 'checked' : '';
    let mainInput = '';
    if (dim.key === 'flexibility') {
      const bOpts = (dim.subFields[0].labels || []).map((lb, idx) => `<option value="${idx+1}" ${Number(rec.bendLevel) === idx+1 ? 'selected' : ''}>${esc(lb)}</option>`).join('');
      const sOpts = (dim.subFields[1].labels || []).map((lb, idx) => `<option value="${idx+1}" ${Number(rec.shoulderLevel) === idx+1 ? 'selected' : ''}>${esc(lb)}</option>`).join('');
      mainInput = `
        <div class="grid-2">
          <div><label style="font-size:11px">直腿体前屈刻度</label><select id="fit_flex_bend"><option value="">请选择</option>${bOpts}</select></div>
          <div><label style="font-size:11px">背后摸背较差侧</label><select id="fit_flex_sh"><option value="">请选择</option>${sOpts}</select></div>
        </div>`;
    } else {
      const val = rec.value != null ? rec.value : '';
      const altCheck = (dim.key === 'power' || dim.key === 'mobility')
        ? `<label style="font-size:11.5px;display:inline-flex;align-items:center;gap:5px;margin-top:4px"><input type="checkbox" id="fit_alt_${dim.key}" ${rec.altUsed ? 'checked' : ''}> 启用温和替代(${esc(dim.altMethod.slice(0,18))}…) 并自动折算</label>`
        : '';
      mainInput = `<input type="number" step="0.1" id="fit_val_${dim.key}" value="${esc(val)}" placeholder="实测数值（${esc(dim.unit)}）">${altCheck}`;
    }

    return `
      <div style="padding:10px 12px;border:1px solid var(--hairline);border-radius:8px;background:var(--surface-2);margin-bottom:10px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px">
          <strong>${esc(dim.name)} <span class="muted" style="font-weight:400;font-size:11.5px">(${esc(dim.unit)})</span></strong>
          <label style="font-size:11.5px;color:var(--warn)"><input type="checkbox" id="fit_skip_${dim.key}" ${skipChecked}> 安全/旧伤跳过</label>
        </div>
        <div class="sec" style="font-size:11.5px;margin-bottom:6px">${esc(dim.method)}</div>
        ${mainInput}
        <input type="text" id="fit_skip_reason_${dim.key}" value="${esc(rec.skipReason || '')}" placeholder="若勾选跳过，填简短原因（如：膝盖不适）" style="margin-top:6px;font-size:11.5px">
      </div>
    `;
  }).join('');

  return `
    <div class="grid-2">
      <div class="panel">
        <div class="panel-head">
          <h2>6 维体能六边形雷达图</h2>
          ${latest ? `<span class="chip chip-accent mono">综合指数 ${latest.totalIndex}/100</span>` : ''}
          ${latest ? `<div class="right" style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn btn-primary btn-sm" onclick="exportStudentFitnessReport('pdf')">导出体能报告 PDF</button>
            <button class="btn btn-sm" onclick="openReportExportModal('fitness')">预览 / 转发网页版</button>
          </div>` : ''}
        </div>
        <div class="panel-body">
          <div class="radar-wrap">${hexSVG}</div>
          ${latest ? `<div class="muted" style="font-size:11px;text-align:center;margin-bottom:8px">橙虚线：同龄同性别基准(60分) · 实线：最新测评(${esc(latest.testDate)})${prev ? ' · 蓝虚线：历史首次对比' : ''}</div>` : ''}
          <div>${dimBadges}</div>
          ${hintsHTML}
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>录入零道具球场测评（全站姿 · 无心率无目测）</h2>
        </div>
        <div class="panel-body">
          <div class="grid-3">
            <div class="field"><label>测评日期</label><input type="date" id="fit_date" value="${todayStr()}"></div>
            <div class="field"><label>性别</label>
              <select id="fit_gender"><option value="male" ${s.gender==='male'?'selected':''}>男</option><option value="female" ${s.gender==='female'?'selected':''}>女</option></select>
            </div>
            <div class="field"><label>体能年龄段</label>
              <select id="fit_age">${(bat.ageGroups||[]).map(ag => `<option value="${esc(ag.id)}" ${s.fitnessAgeGroup===ag.id?'selected':''}>${esc(ag.name)}</option>`).join('')}</select>
            </div>
          </div>
          ${formInputs}
          <button class="btn btn-primary" style="width:100%" onclick="submitStudentFitness('${esc(s.id)}', this)">保存 6 维体能测评并生成六边形报告</button>
        </div>
      </div>
    </div>
  `;
}

window.submitStudentFitness = async function(studentId, btn) {
  return withBusy(btn, async () => {
    const gender = $('#fit_gender').value;
    const ageGroup = $('#fit_age').value;
    const testDate = $('#fit_date').value || todayStr();
    const raw = {};
    for (const dim of (V3.battery.dimensions || [])) {
      const skipped = $('#fit_skip_' + dim.key).checked;
      const skipReason = ($('#fit_skip_reason_' + dim.key).value || '').trim();
      if (skipped) { raw[dim.key] = { skipped: true, skipReason: skipReason || '安全保护跳过' }; continue; }
      if (dim.key === 'flexibility') {
        const b = $('#fit_flex_bend').value;
        const sh = $('#fit_flex_sh').value;
        if (b || sh) raw.flexibility = { bendLevel: b ? Number(b) : null, shoulderLevel: sh ? Number(sh) : null };
      } else {
        const val = $('#fit_val_' + dim.key).value;
        const altEl = $('#fit_alt_' + dim.key);
        const altUsed = altEl ? altEl.checked : false;
        if (val !== '') raw[dim.key] = { value: Number(val), altUsed, autoScaleAlt: altUsed };
      }
    }
    try {
      await api(`/v3/students/${encodeURIComponent(studentId)}/fitness`, {
        method: 'POST',
        body: JSON.stringify({ testDate, gender, ageGroup, raw })
      });
      await refreshAll();
      V3.studentTab = 'fitness';
      await loadStudentReport(studentId);
      toast('已保存 6 维球场体能报告，并联动 60 分钟课堂适配！');
      renderStudents();
    } catch (e) { toast('体能提交失败：' + e.message); }
  });
};

/* ==================== 3. 教学计划与 60 分钟教案 + 课后独立打分 ==================== */
function renderPlans() {
  const box = $('#view-plans');
  const plan = V3.plans.find(p => p.id === V3.activePlanId) || V3.plans[0] || null;
  if (plan) V3.activePlanId = plan.id;

  const planListHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>教学计划 (${V3.plans.length})</h2>
        <div class="right"><button class="btn btn-primary btn-sm" onclick="openNewPlanModal()">+ 新建</button></div>
      </div>
      <div class="panel-body">
        ${V3.plans.length ? V3.plans.map(p => `
          <div class="list-card ${plan && p.id === plan.id ? 'active' : ''}" onclick="selectPlan('${esc(p.id)}')">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
              <strong>${esc(p.name)}</strong>
              <span class="chip ${p.packageType==='solo'?'chip-accent':'chip-info'}" style="margin-left:auto">${p.packageType==='solo'?'1v1私教':'小班('+(p.students||[]).length+'人)'}</span>
            </div>
            <div class="sec" style="font-size:11.5px;margin-bottom:6px">
              学员：${esc((p.students||[]).map(s=>s.name).join('、'))} · ${p.defaultMinutes}'/节
            </div>
            <div class="bar-bg"><div class="bar-fill" style="width:${p.totalLessons?Math.round((p.usedLessons/p.totalLessons)*100):0}%"></div></div>
            <div class="mono sec" style="font-size:11px;margin-top:4px">已上 ${p.usedLessons} / ${p.totalLessons} 节</div>
          </div>
        `).join('') : `<div class="sec" style="text-align:center;padding:24px 0">暂无教学计划，点右上角「+ 新建」为个人或小班排课。</div>`}
      </div>
    </div>
  `;

  if (!plan) {
    box.innerHTML = `<div class="split-plan">${planListHTML}<div class="panel"><div class="panel-body">请选择或新建教学计划。</div></div></div>`;
    return;
  }

  const lessons = plan.lessons || [];
  let activeLes = lessons.find(l => l.id === V3.activeLessonId) || lessons.find(l => l.status === 'planned') || lessons[0] || null;
  if (activeLes && (!V3.activeLessonDetail || V3.activeLessonDetail.lesson.id !== activeLes.id)) {
    loadLessonDetail(plan.id, activeLes.id).then(() => { if (V3.view === 'plans') renderPlans(); });
  }

  const lessonsHTML = lessons.map((l, idx) => {
    const locked = l.status === 'completed';
    const isSel = activeLes && l.id === activeLes.id;
    const canMoveUp = !locked && idx > 0 && lessons[idx - 1].status !== 'completed';
    const canMoveDown = !locked && idx < lessons.length - 1;
    return `
      <div class="list-card ${isSel ? 'active' : ''}" onclick="openPlanLesson('${esc(plan.id)}','${esc(l.id)}')">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
          <span class="mono sec" style="font-size:11.5px">#${l.seq}</span>
          <span class="chip ${locked?'chip-ok':'chip-accent'} mono">${esc(l.moduleCode)}${l.secondaryModuleCode ? '+'+esc(l.secondaryModuleCode) : ''}</span>
          <strong style="font-size:13px">${esc(l.moduleTitle)}</strong>
          <span class="chip ${locked?'chip-ok':''}" style="margin-left:auto">${locked ? '🔒 已上完锁定' : (l.plannedDate || '待定')} · ${l.minutes}'</span>
        </div>
        ${!locked ? `
          <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px" onclick="event.stopPropagation()">
            <button class="btn btn-sm" ${canMoveUp?'':'disabled'} onclick="movePlanLesson('${esc(plan.id)}','${esc(l.id)}',-1)">↑</button>
            <button class="btn btn-sm" ${canMoveDown?'':'disabled'} onclick="movePlanLesson('${esc(plan.id)}','${esc(l.id)}',1)">↓</button>
            <button class="btn btn-sm" onclick="openEditLessonModal('${esc(plan.id)}','${esc(l.id)}')">改模块/合练</button>
            <button class="btn btn-sm" onclick="openInsertLessonModal('${esc(plan.id)}','${esc(l.id)}')">+ 后插课</button>
            <button class="btn btn-sm btn-danger" onclick="removePlanLesson('${esc(plan.id)}','${esc(l.id)}')">删</button>
          </div>
        ` : ''}
      </div>

window.movePlanLesson = async function(planId, lessonId, dir) {
  const plan = V3.plans.find(p => p.id === planId);
  if (!plan) return;
  const ids = (plan.lessons || []).map(l => l.id);
  const idx = ids.indexOf(lessonId);
  const swapIdx = idx + dir;
  if (idx < 0 || swapIdx < 0 || swapIdx >= ids.length) return;
  [ids[idx], ids[swapIdx]] = [ids[swapIdx], ids[idx]];
  try {
    const updated = await api(`/v3/plans/${encodeURIComponent(planId)}/reorder`, {
      method: 'POST', body: JSON.stringify({ orderedLessonIds: ids })
    });
    const pi = V3.plans.findIndex(p => p.id === planId);
    if (pi >= 0) V3.plans[pi] = updated;
    toast('课次顺序已调整');
    renderPlans();
  } catch (e) { toast('调序失败：' + e.message); }
};

window.removePlanLesson = async function(planId, lessonId) {
  if (!confirm('确认删除该未上课次？')) return;
  try {
    const updated = await api(`/v3/plans/${encodeURIComponent(planId)}/lessons/${encodeURIComponent(lessonId)}`, { method: 'DELETE' });
    const pi = V3.plans.findIndex(p => p.id === planId);
    if (pi >= 0) V3.plans[pi] = updated;
    V3.activeLessonId = null;
    V3.activeLessonDetail = null;
    toast('已删除未上课次');
    renderPlans();
  } catch (e) { toast('删除失败：' + e.message); }
};

window.submitLessonCompletion = async function(planId, lessonId, btn) {
  return withBusy(btn, async () => {
    const detail = V3.activeLessonDetail;
    if (!detail) return;
    const studentReviews = (detail.students || []).map(st => {
      const attend = $('#rev_att_' + st.id).value;
      const score = Number($('#rev_sc_' + st.id).value);
      const secEl = $('#rev_sec_' + st.id);
      const rpeEl = $('#rev_rpe_' + st.id);
      return {
        studentId: st.id,
        attend,
        score,
        secondaryScore: secEl ? Number(secEl.value) : undefined,
        rpe: rpeEl ? Number(rpeEl.value) : 6,
        feedback: ($('#rev_fb_' + st.id).value || '').trim(),
        homework: ($('#rev_hw_' + st.id).value || '').trim()
      };
    });
    try {
      const res = await api(`/v3/plans/${encodeURIComponent(planId)}/lessons/${encodeURIComponent(lessonId)}/complete`, {
        method: 'POST',
        body: JSON.stringify({
          completedDate: $('#rev_date').value || todayStr(),
          coachNote: ($('#rev_coach_note').value || '').trim(),
          studentReviews
        })
      });
      await refreshAll();
      await loadLessonDetail(planId, lessonId);
      toast(`课次已锁定！为 ${(res.generatedSnapshots || []).length} 名出勤学员自动生成了历史成长快照`);
      renderPlans();
    } catch (e) { toast('结算失败：' + e.message); }
  });
};

async function persistCurriculumConfig(newCfg, msg) {
  try {
    await api('/v3/curriculum/config', { method: 'PUT', body: JSON.stringify(newCfg) });
    V3.config = newCfg;
    V3.activeLessonDetail = null;
    await refreshAll();
    toast(msg || '大纲配置已热更新并同步全平台');
  } catch (e) { toast('配置保存失败：' + e.message); }
}

window.deleteConfigModule = async function(code) {
  const cfg = JSON.parse(JSON.stringify(V3.config));
  if (cfg.modules.length <= 1) return toast('至少保留 1 个模块');
  const idx = cfg.modules.findIndex(m => m.code === code);
  if (idx < 0) return toast('未找到该模块');
  const removed = cfg.modules.splice(idx, 1)[0];
  cfg.bundles = (cfg.bundles || []).map(b => ({ ...b, codes: (b.codes || []).filter(c => c !== removed.code) }));
  await persistCurriculumConfig(cfg, `已删除模块 ${removed.code} 并同步`);
};

  return withBusy(btn, async () => {
    const old_password = $('#pw_old').value || '';

    const new2 = $('#pw_new2').value || '';
    if (!old_password || new_password.length < 10) return toast('请填写原密码，且新密码不少于 10 位');

    try {
      await api('/auth/change-password', {
        method: 'POST',
        body: JSON.stringify({ old_password, new_password })

      toast('密码修改成功，旧令牌已全部吊销，请使用新密码重新登录');

};

window.setModalScore = function(btn) {
  const grp = btn.parentElement;
  grp.querySelectorAll('.score-pill').forEach(b => b.classList.remove('active'));

};

window.applyModalScorePreset = function(kind) {
  document.querySelectorAll('[data-mod-score]').forEach(grp => {
    const code = grp.dataset.modScore;
    let val = 0;
    if (kind === 'racket' && /^B0[1-4]$/.test(code)) val = 2;
    if (kind === 'rec25' && /^B/.test(code)) val = 2;
    grp.querySelectorAll('.score-pill').forEach(b => {
      b.classList.toggle('active', Number(b.dataset.val) === val);
    });
  });
};

window.submitModuleConfig = async function(editCode) {
  const cfg = JSON.parse(JSON.stringify(V3.config));
  const code = ($('#em_code').value || '').trim();
  const title = ($('#em_title').value || '').trim();
  const kp = ($('#em_kp').value || '').split('\n').map(x => x.trim()).filter(Boolean);
  if (!code || !title || !kp.length) return toast('编号、标题与至少一条判据必填');
  const idx = editCode ? cfg.modules.findIndex(x => x.code === editCode) : -1;
  if (!editCode && cfg.modules.some(x => x.code === code)) return toast(`模块编号 ${code} 已存在`);
  const existing = idx >= 0 ? cfg.modules[idx] : {
    seq: cfg.modules.length + 1,
    plan60: { warmupFocus: '动态热身 5 分钟 + 小碎步激活 3 分钟', explainFocus: `${title} 核心原理`, drills: ['定点多球分解练习，每人 {balls} 球×2 组'], play: '条件限制实战', hw: '动作复盘与居家作业' }
  };
  const nextMod = {
    ...existing,
    code,
    track: $('#em_track').value,
    categoryId: $('#em_cat').value,
    title,
    difficulty: Math.max(1, Math.min(5, Number($('#em_diff').value) || 3)),
    kp,
    remedialFocus: ($('#em_rem').value || '').trim(),
    plan60: { ...(existing.plan60 || {}), goal: ($('#em_goal').value || '').trim() || title }
  };
  if (idx >= 0) cfg.modules[idx] = nextMod;
  else cfg.modules.push(nextMod);
  closeModal();
  await persistCurriculumConfig(cfg, `模块 ${code} 已保存并全平台同步`);
};

/* ==================== 报告文档生成与预览导出（技术报告 + 6维体能报告） ==================== */
function getActiveReportContext(kind) {
  const rpt = V3.activeStudentReport;
  if (!rpt || !rpt.student) throw new Error('请先选择一名学员');
  const ageGroupName = getAgeGroupName(rpt.student.fitnessAgeGroup);
  const scaleArr = (V3.config && (V3.config.scoringScale || V3.config.scoreScale)) || [];
  const scoreLabels = {};
  for (const x of scaleArr) {
    const sc = x.score != null ? x.score : x.value;
    if (sc != null) scoreLabels[Number(sc)] = `${sc}·${x.label}`;
  }

  if (kind === 'tech') {
    const snaps = rpt.snapshots || [];
    const curSnap = snaps.find(x => x.id === V3.compareSnapshotIds.current) || rpt.latestSnapshot || snaps[0] || null;
    const prevSnap = snaps.find(x => x.id === V3.compareSnapshotIds.prev) || (snaps.length > 1 ? snaps[snaps.length - 1] : curSnap);
    const cats = (curSnap && curSnap.categories) || (rpt.liveAssessment && rpt.liveAssessment.categories) || [];
    const prevCatMap = new Map(((prevSnap && prevSnap.categories) || []).map(c => [c.id, Number(c.score) || 0]));
    const radarSvg = renderPolygonRadarSVG(
      cats.map(c => ({ label: c.name.slice(0, 4) })),
      cats.map(c => c.score),
      prevSnap && curSnap && prevSnap.id !== curSnap.id ? cats.map(c => prevCatMap.get(c.id) || 0) : null,
      { size: 300, maxVal: 10, refVal: 6, ariaLabel: '7大技术类别能力雷达图' }
    );
    return {
      kind,
      opts: {
        report: rpt,
        currentSnapshot: curSnap,
        prevSnapshot: prevSnap,
        ageGroupName,
        triggerLabel: curSnap ? getTriggerLabel(curSnap.triggerType) : '实时评估',
        scoreLabels,
        radarSvg
      }
    };
  }

  const hist = rpt.fitnessHistory || [];
  const latest = hist[0] || rpt.latestFitness;
  if (!latest) throw new Error('该学员暂无已保存的 6 维体能测评记录');
  const prev = hist.length > 1 ? hist[hist.length - 1] : null;
  const radarSvg = renderFitnessHexagonSVG(latest, prev);
  return {
    kind: 'fitness',
    opts: {
      report: rpt,
      fitness: latest,
      ageGroupName: getAgeGroupName(latest.ageGroup || rpt.student.fitnessAgeGroup),
      radarSvg
    }
  };
}

  try {
    if (!window.PKB_REPORT) throw new Error('报告生成模块尚未加载，请刷新页面');
    const ctx = getActiveReportContext('tech');
    if (format === 'html') {
      const html = window.PKB_REPORT.buildTechnicalReportHtml(ctx.opts);
      const fname = `${ctx.opts.report.student.name}-技术类别能力报告-${todayStr()}.html`;
      window.PKB_REPORT.downloadBlob(new Blob([html], { type: 'text/html;charset=utf-8' }), fname);
      toast(`已生成并导出分享网页：${fname}`);
      return;
    }
    const { blob, filename } = window.PKB_REPORT.generateTechnicalPdfBlob(ctx.opts);
    window.PKB_REPORT.downloadBlob(blob, filename);
    toast(`已生成并开始下载技术报告 PDF：${filename}`);
  } catch (e) { toast('导出失败：' + e.message); }
};

window.exportStudentFitnessReport = function(format) {
  try {
    if (!window.PKB_REPORT) throw new Error('报告生成模块尚未加载，请刷新页面');
    const ctx = getActiveReportContext('fitness');
    if (format === 'html') {
      const html = window.PKB_REPORT.buildFitnessReportHtml(ctx.opts);
      const fname = `${ctx.opts.report.student.name}-6维体能测评报告-${ctx.opts.fitness.testDate}.html`;
      window.PKB_REPORT.downloadBlob(new Blob([html], { type: 'text/html;charset=utf-8' }), fname);
      toast(`已生成并导出分享网页：${fname}`);
      return;
    }
    const { blob, filename } = window.PKB_REPORT.generateFitnessPdfBlob(ctx.opts);
    window.PKB_REPORT.downloadBlob(blob, filename);
    toast(`已生成并开始下载体能报告 PDF：${filename}`);
  } catch (e) { toast('导出失败：' + e.message); }
};

window.openReportExportModal = function(kind) {
  try {
    if (!window.PKB_REPORT) throw new Error('报告生成模块尚未加载');
    const ctx = getActiveReportContext(kind);
    const res = kind === 'tech'
      ? window.PKB_REPORT.generateTechnicalPdfBlob(ctx.opts)
      : window.PKB_REPORT.generateFitnessPdfBlob(ctx.opts);
    const previewImgs = (res.pages || []).map((pg, idx) =>
      `<div style="margin-bottom:14px">
        <div class="muted" style="font-size:11.5px;margin-bottom:6px">第 ${idx + 1} / ${res.pages.length} 页（A4 高清排版预览）</div>
        <img src="${pg.dataUrl}" alt="报告第${idx + 1}页" style="width:100%;border-radius:8px;border:1px solid var(--hairline-2);background:#fff">
      </div>`
    ).join('');

    const pdfUrl = URL.createObjectURL(res.blob);
    window._lastReportPdfUrl && URL.revokeObjectURL(window._lastReportPdfUrl);
    window._lastReportPdfUrl = pdfUrl;

    const dlAction = kind === 'tech' ? "exportStudentTechReport('pdf')" : "exportStudentFitnessReport('pdf')";
    const htmlAction = kind === 'tech' ? "exportStudentTechReport('html')" : "exportStudentFitnessReport('html')";
    openModal(
      kind === 'tech' ? `技术类别报告导出预览 · ${ctx.opts.report.student.name}` : `6 维体能测评报告导出预览 · ${ctx.opts.report.student.name}`,
      `<div class="notice notice-accent" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <span>可直接下载标准 <strong>.pdf 文档</strong> 或单文件 <strong>.html 分享网页</strong> 发给学员微信查看。</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn btn-primary btn-sm" onclick="${dlAction}">下载 PDF (.pdf)</button>
          <a class="btn btn-sm" href="${pdfUrl}" target="_blank" rel="noopener">新窗口打开 PDF</a>
          <button class="btn btn-sm" onclick="${htmlAction}">下载微信网页版 (.html)</button>
        </div>
      </div>
      <div>${previewImgs}</div>`,
      `<button class="btn" onclick="closeModal()">关闭</button>
       <button class="btn btn-primary" onclick="${dlAction}">立即下载 PDF</button>`
    );
  } catch (e) { toast('无法生成报告预览：' + e.message); }
};
